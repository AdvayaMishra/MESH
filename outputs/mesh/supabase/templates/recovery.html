<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Reset your MESH password</title></head>
<body>
  <h1>Reset your MESH password</h1>
  <p>Enter this one-time code in the MESH password recovery screen:</p>
  <p style="font-size:28px;letter-spacing:4px"><strong>{{ .Token }}</strong></p>
  <p>This code expires according to the configured verification window. Never share it with anyone.</p>
  <p>If you did not request a password reset, ignore this email. Your password has not been changed.</p>
</body>
</html>
